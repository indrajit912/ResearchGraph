{% extends 'admin/base.html' %}
{% block admin_content %}
<div class="mb-4">
    <a href="{{ url_for('admin.manage_api_keys') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to API Keys</a>
</div>

<h2>API Key Generated</h2>

<div class="alert alert-warning border-warning mt-4 shadow-sm" role="alert">
    <h5 class="alert-heading fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i> Save your API key!</h5>
    <p>Please copy your new API key now. For your security, it will <strong>never be shown again</strong>.</p>
    <hr>
    
    <div class="input-group mb-3 mt-4">
        <input type="text" class="form-control font-monospace form-control-lg bg-white" id="apiKeyInput" value="{{ raw_key }}" readonly>
        <button class="btn btn-warning fw-bold px-4" type="button" id="copyBtn" onclick="copyKey()">
            <i class="bi bi-clipboard"></i> Copy
        </button>
    </div>
</div>

<script>
function copyKey() {
    var copyText = document.getElementById("apiKeyInput");
    copyText.select();
    copyText.setSelectionRange(0, 99999); // For mobile devices
    navigator.clipboard.writeText(copyText.value);
    
    var btn = document.getElementById("copyBtn");
    btn.innerHTML = '<i class="bi bi-check-lg"></i> Copied!';
    setTimeout(function() {
        btn.innerHTML = '<i class="bi bi-clipboard"></i> Copy';
    }, 2000);
}
</script>
{% endblock %}
