{% extends 'admin/base.html' %}
{% block admin_content %}
<div class="mb-4">
    <a href="{{ url_for('admin.manage_api_keys') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to API Keys</a>
</div>

<h2>Generate New API Key</h2>
<p class="text-muted">Create a new API key for programmatic administrative access.</p>

<div class="card shadow-sm border-0 col-md-8 col-lg-6 mt-4">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-3">
                <label class="form-label fw-bold">Key Name (Optional)</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. CI/CD Pipeline, Migration Script">
                <div class="form-text">A description to help you remember what this key is used for.</div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Expiration</label>
                <select name="expiration_days" class="form-select">
                    <option value="7">7 Days</option>
                    <option value="30" selected>30 Days</option>
                    <option value="90">90 Days</option>
                    <option value="365">1 Year</option>
                    <option value="0">Never Expire (Not Recommended)</option>
                </select>
                <div class="form-text">Choose when this key should automatically expire.</div>
            </div>
            
            <button type="submit" class="btn btn-primary"><i class="bi bi-key-fill me-1"></i> Generate API Key</button>
        </form>
    </div>
</div>
{% endblock %}
