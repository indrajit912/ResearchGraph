{% extends 'admin/base.html' %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Researchers</h2>
    <a href="{{ url_for('admin.create_researcher') }}" class="btn btn-success btn-sm">Add New</a>
</div>
<form method="GET" class="mb-4">
    <div class="input-group">
        <input type="text" name="q" class="form-control" placeholder="Search researchers..." value="{{ q }}">
        <button class="btn btn-primary" type="submit">Search</button>
    </div>
</form>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Affiliation</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for r in researchers %}
        <tr>
            <td>{{ r.display_name }}</td>
            <td>{{ r.affiliation or '-' }}</td>
            <td>
                <a href="{{ url_for('admin.view_researcher', uuid=r.uuid) }}" class="btn btn-sm btn-info">View</a>
                <a href="{{ url_for('admin.edit_researcher', uuid=r.uuid) }}" class="btn btn-sm btn-warning">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
